name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Privacy guard
        run: python scripts/privacy_check.py --history
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate documented examples
        run: python -m evidence_bench validate examples/synthetic.jsonl data/public-facts.jsonl
      - name: Require reviewed real cases
        run: python -m evidence_bench validate data/public-facts.jsonl --real-only --require-reviewed
