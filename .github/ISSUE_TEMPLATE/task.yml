name: Task or source correction
description: Propose one task or correct one source-backed claim.
title: "[Task] "
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples. Do not include credentials, personal records, private chat links or local machine paths."
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected result
      description: State one concrete problem and how completion can be checked.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sources or reproducible example
      description: Link public original sources or give a synthetic example; explain remaining uncertainty.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I checked that this issue contains no personal or secret values.
          required: true
